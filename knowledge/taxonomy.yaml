version: 1
# shard: true  -> this category gets a dedicated Discoverer (Phase 1.4)
# smartbugs:   -> label used by SmartBugs Curated (null = not in that dataset; verify when the dataset is downloaded)
# slither_detectors: -> Slither `check` names mapped to this category. Rule: list a detector ONLY if
#     it means the SAME thing as the category; every other detector falls back to `other`.
#     Reason: a wrong mapping makes the evaluation count an unrelated finding as a hit
#     (e.g. `missing-zero-check` sits on the same lines as a missing owner check but is not one).
#     Names must exist in the checked-in detector list, see tests/unit/test_taxonomy.py.
categories:
  - id: reentrancy
    name: Reentrancy
    description: External call made before state is updated, letting the callee re-enter.
    swc: [SWC-107]
    smartbugs: reentrancy
    shard: true
    slither_detectors:
      - reentrancy-eth
      - reentrancy-no-eth
      - reentrancy-balance
      - reentrancy-benign
      - reentrancy-events
      - reentrancy-unlimited-gas

  - id: access_control
    name: Access Control
    description: Missing or flawed authorization on privileged functions (incl. tx.origin misuse, unprotected selfdestruct/initializer).
    swc: [SWC-105, SWC-106, SWC-115]
    smartbugs: access_control
    shard: true
    slither_detectors:
      - suicidal
      - protected-vars
      - unprotected-upgrade
      - tx-origin
      - arbitrary-send-eth

  - id: oracle_manipulation
    name: Oracle / Price Manipulation
    description: Price or state read from a manipulable source (spot price, flash-loan-sensitive pool reserves).
    swc: []
    smartbugs: null
    shard: true

  - id: arithmetic
    name: Integer / Precision Errors
    description: Overflow/underflow, rounding, division-before-multiplication, decimals mismatch.
    swc: [SWC-101]
    smartbugs: arithmetic
    shard: true
    slither_detectors:
      - divide-before-multiply
      - incorrect-exp

  - id: business_logic
    name: Business Logic
    description: Protocol-specific logic flaws not covered by generic patterns (accounting errors, broken invariants, bad state transitions).
    swc: []
    smartbugs: null
    shard: true

  - id: unchecked_low_level_calls
    name: Unchecked Low-level Calls
    description: Return value of call/send/delegatecall ignored.
    swc: [SWC-104]
    smartbugs: unchecked_low_level_calls
    shard: false
    slither_detectors:
      - unchecked-lowlevel
      - unchecked-send

  - id: denial_of_service
    name: Denial of Service
    description: Unbounded loops, failing external calls, or griefing that blocks contract functionality.
    swc: [SWC-113, SWC-128]
    smartbugs: denial_of_service
    shard: false
    slither_detectors:
      - calls-loop

  - id: bad_randomness
    name: Bad Randomness
    description: On-chain predictable values (blockhash, timestamp) used as randomness.
    swc: [SWC-120]
    smartbugs: bad_randomness
    shard: false
    slither_detectors:
      - weak-prng

  - id: time_manipulation
    name: Time Manipulation
    description: Critical logic depends on block.timestamp, which miners can skew.
    swc: [SWC-116]
    smartbugs: time_manipulation
    shard: false
    slither_detectors:
      - timestamp

  - id: front_running
    name: Front-running
    description: Transaction ordering dependence exploitable by observers of the mempool.
    swc: [SWC-114]
    smartbugs: front_running
    shard: false

  - id: short_addresses
    name: Short Address
    description: Malformed-calldata (short address) attack on token transfers.
    swc: []
    smartbugs: short_addresses
    shard: false

  - id: other
    name: Other
    description: Anything not fitting the categories above. Also the fallback for every unmapped Slither detector.
    swc: []
    smartbugs: other
    shard: false