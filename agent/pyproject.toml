[project]
name = "audit-agent"
version = "0.1.0"
description = "Smart contract security audit agent"
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.14",
    "openai>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "qdrant-client>=1.9",
    "diskcache>=5.6",
    "tenacity>=8.3",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "slither-analyzer>=0.10",
    "grpcio>=1.64",
    "grpcio-tools>=1.64",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
audit-agent = "audit_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_agent"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
