# Ground truth for the hand-written samples. Line numbers are 1-based and refer to the files
# exactly as committed: do NOT reformat them. Never put hints like these inside the .sol files.
samples:
  - file: samples/vulnerable/Bank.sol
    findings:
      - category: reentrancy
        function: withdraw
        line_start: 11     # whole function
        line_end: 17
        # the external call is on line 14, the state update after it on line 16
  - file: samples/vulnerable/Vault.sol
    findings:
      - category: access_control
        function: setOwner
        line_start: 13
        line_end: 15
  - file: samples/safe/Bank.sol
    findings: []