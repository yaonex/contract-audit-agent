# Phase 2. Default services: qdrant, agent (gRPC), server (Go).
# PostgreSQL is optional: docker compose --profile postgres up
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]

  # agent:
  #   build: ./agent
  #   env_file: .env
  #   depends_on: [qdrant]

  # server:
  #   build: ./server
  #   env_file: .env
  #   ports: ["8080:8080"]
  #   depends_on: [agent]

  postgres:
    image: postgres:16
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit
    ports: ["5432:5432"]

volumes:
  qdrant_data:
